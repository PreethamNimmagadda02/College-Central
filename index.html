<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://*.googleapis.com https://*.firebaseapp.com https://*.emailjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebase.com https://*.emailjs.com https://api.emailjs.com wss://*.firebaseio.com; frame-src 'self' https://*.firebaseapp.com https://*.googleapis.com; object-src 'none'; base-uri 'self';" />

  <!-- Primary Meta Tags -->
  <title>College Central - Student Portal</title>
  <meta name="title" content="College Central - Student Portal" />
  <meta name="description"
    content="A comprehensive student hub providing access to grades, schedules, events, and more in a modern, user-friendly interface." />
  <meta name="keywords" content="student portal, grades, schedule, campus map, academic calendar, college" />
  <meta name="author" content="College Central" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://collegecentral.live/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://collegecentral.live/" />
  <meta property="og:title" content="College Central - Student Portal" />
  <meta property="og:description"
    content="Comprehensive student portal - Manage grades, schedules, campus navigation, and academic resources." />
  <meta property="og:image" content="https://collegecentral.live/logo.svg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://collegecentral.live/" />
  <meta property="twitter:title" content="College Central - Student Portal" />
  <meta property="twitter:description"
    content="Comprehensive student portal - Manage grades, schedules, campus navigation, and academic resources." />
  <meta property="twitter:image" content="https://collegecentral.live/logo.svg" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
  <link rel="shortcut icon" type="image/svg+xml" href="/logo.svg?v=2" />
  <link rel="icon" type="image/svg+xml" sizes="32x32" href="/logo.svg?v=2" />
  <link rel="icon" type="image/svg+xml" sizes="16x16" href="/logo.svg?v=2" />

  <!-- Apple Touch Icon for iOS (PNG required for better display) -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="College Central" />

  <script>
    // Capacitor.js placeholder for web development
    if (typeof window !== 'undefined' && !window.Capacitor) {
      window.Capacitor = {
        isNativePlatform: () => false,
        getPlatform: () => 'web'
      };
    }
  </script>

  <!-- Structured Data (JSON-LD) for SEO -->
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "College Central",
  "alternateName": "College Central Student Portal",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Web",
  "description": "Comprehensive student portal - Manage grades, schedules, campus navigation, events, and academic resources.",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "4.8",
    "ratingCount": "150"
  },
  "featureList": [
    "Grade Management",
    "Class Schedule",
    "Campus Map",
    "Academic Calendar",
    "College Forms",
    "Faculty Directory"
  ]
}
</script>

  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "EducationalOrganization",
  "name": "College Central - Student Portal",
  "alternateName": ["College Central", "College Central Student Hub"],
  "url": "https://collegecentral.live",
  "logo": "https://collegecentral.live/logo.svg",
  "description": "Comprehensive student portal and companion app for students. Manage academic life with grade tracking, schedule management, campus navigation, event calendar, and instant access to college resources."
}
</script>
</head>

<body class="bg-light-bg dark:bg-dark-bg text-slate-800 dark:text-dark-text">
  <div id="app-splash">
    <style>
      .splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
        z-index: 9999;
        transition: opacity 0.5s ease-out;
        pointer-events: none;
        /* Allow clicks to pass through once fading starts */
      }

      @media (prefers-color-scheme: dark) {
        .splash-screen {
          background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
      }

      .splash-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .splash-text {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        color: #334155;
        opacity: 0;
        transform: translateY(10px);
        animation: fade-up 0.8s ease-out forwards 0.3s;
      }

      @media (prefers-color-scheme: dark) {
        .splash-text {
          color: #e2e8f0;
        }
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.95);
          opacity: 0.8;
        }

        50% {
          transform: scale(1.05);
          opacity: 1;
        }

        100% {
          transform: scale(0.95);
          opacity: 0.8;
        }
      }

      @keyframes fade-up {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
    <div class="splash-screen">
      <img src="/logo.svg" alt="College Central" class="splash-logo" />
      <div class="splash-text">College Central</div>
    </div>
  </div>
  <div id="root"></div>
  <noscript>
    <div style="padding: 20px; text-align: center; font-family: sans-serif;">
      <h1>College Central</h1>
      <p>JavaScript is required to run this application. Please enable JavaScript in your browser settings.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
